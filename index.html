<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WorldChat - Global Rooms</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        html, body { height: 100%; width: 100%; overflow: hidden; background: #f8fafc; }
        
        /* APP CONTAINER */
        .app-main { display: flex; flex-direction: column; height: 100vh; height: -webkit-fill-available; }

        /* HEADER */
        header { height: 50px; background: #ffffff; padding: 0 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; flex-shrink: 0; }
        .logo { display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 800; color: #2563eb; }
        .logo-icon { width: 28px; height: 28px; background: #2563eb; color: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .user-profile-header { display: flex; align-items: center; gap: 8px; }
        .user-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 2px solid #2563eb; cursor: pointer; }
        .btn-logout { background: #fee2e2; color: #ef4444; border: 1px solid #fca5a5; padding: 3px 8px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 11px; }

        /* BODY LAYOUT */
        .app-body { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* SIDEBAR / ROOMS */
        .sidebar { width: 100px; background: #ffffff; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-title { padding: 8px 4px; font-size: 10px; font-weight: 700; color: #64748b; border-bottom: 1px solid #f1f5f9; text-align: center; text-transform: uppercase; }
        .country-list { overflow-y: auto; flex: 1; }
        .country-btn { width: 100%; padding: 8px 6px; border: none; background: transparent; text-align: left; display: flex; align-items: center; gap: 4px; cursor: pointer; font-weight: 600; font-size: 11px; color: #475569; border-bottom: 1px solid #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .country-btn.active { background: #eff6ff; color: #2563eb; font-weight: 700; }

        /* CHAT AREA */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #f1f5f9; height: 100%; overflow: hidden; }
        .chat-header { padding: 8px 12px; background: #fff; border-bottom: 1px solid #e2e8f0; font-weight: 700; font-size: 13px; color: #1e293b; flex-shrink: 0; }
        
        /* MESSAGES LIST */
        .chat-messages { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg-card { display: flex; gap: 6px; background: #fff; padding: 6px 10px; border-radius: 8px; width: fit-content; max-width: 88%; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .msg-avatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; cursor: pointer; flex-shrink: 0; }
        .msg-info { font-size: 10px; color: #64748b; margin-bottom: 2px; }
        .msg-author { font-weight: 700; color: #1e293b; cursor: pointer; }
        .msg-text { font-size: 12px; color: #334155; word-break: break-word; }

        /* FIXED BOTTOM INPUT BAR */
        .chat-input-box { padding: 8px; background: #fff; border-top: 1px solid #e2e8f0; display: flex; gap: 6px; flex-shrink: 0; }
        .chat-input { flex: 1; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 13px; }
        .btn-send { background: #2563eb; color: white; border: none; padding: 0 14px; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; }

        /* MODALS */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 15px; }
        .modal-box { background: #fff; padding: 18px; border-radius: 12px; width: 100%; max-width: 300px; text-align: center; position: relative; }
        .modal-box h3 { margin-bottom: 10px; color: #1e293b; font-size: 16px; }
        .modal-box input { width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; }
        .file-label { display: block; text-align: left; font-size: 10px; margin-bottom: 2px; color: #64748b; font-weight: 600; }
        .close-modal { position: absolute; top: 8px; right: 10px; background: none; border: none; font-size: 16px; cursor: pointer; color: #64748b; }
        .profile-img-lg { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid #2563eb; margin-bottom: 8px; }
    </style>
</head>
<body>

    <div class="app-main">
        <!-- LOGIN MODAL -->
        <div class="modal-overlay" id="loginModal">
            <div class="modal-box">
                <h3>Welcome to WorldChat</h3>
                <span class="file-label">Profile Photo:</span>
                <input type="file" id="picInput" accept="image/*">
                <input type="text" id="nameInput" placeholder="Enter Your Name">
                <span class="file-label">Date of Birth:</span>
                <input type="date" id="dobInput">
                <button class="btn-send" style="width:100%; padding:8px; margin-top:4px;" onclick="saveUser()">Join Chat</button>
            </div>
        </div>

        <!-- PROFILE VIEW MODAL -->
        <div class="modal-overlay" id="profileModal" style="display: none;">
            <div class="modal-box">
                <button class="close-modal" onclick="closeProfileModal()">✕</button>
                <img id="viewUserPic" src="" class="profile-img-lg">
                <h3 id="viewUserName">User Name</h3>
                <p id="viewUserDob" style="font-size: 12px; color: #64748b; margin-top: 4px;">DOB: --/--/----</p>
            </div>
        </div>

        <!-- HEADER -->
        <header>
            <div class="logo">
                <div class="logo-icon">⚡</div>
                <span>WorldChat</span>
            </div>
            <div class="user-profile-header">
                <img id="userHeaderPic" src="https://via.placeholder.com/28" class="user-avatar" onclick="openMyProfile()">
                <div id="userHeaderName" style="font-weight:700; font-size:11px;">Guest</div>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </header>

        <!-- BODY -->
        <div class="app-body">
            <div class="sidebar">
                <div class="sidebar-title">Rooms (25)</div>
                <div class="country-list" id="countryList"></div>
            </div>

            <div class="chat-area">
                <div class="chat-header" id="currentRoomTitle">🌐 Saudi Arabia Chatroom</div>
                <div class="chat-messages" id="chatMessages"></div>
                
                <div class="chat-input-box">
                    <input type="text" id="msgInput" class="chat-input" placeholder="Type a message...">
                    <button class="btn-send" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyAz2WOC9A7nGq2dVRNIT0BKo9sPcc1z08k",
      authDomain: "free-chat66.firebaseapp.com",
      projectId: "free-chat66",
      storageBucket: "free-chat66.firebasestorage.app",
      messagingSenderId: "967226596729",
      appId: "1:967226596729:web:41a3903345b1a7122fe3a8",
      measurementId: "G-JJ2YWDR0VH",
      databaseURL: "https://free-chat66-default-rtdb.firebaseio.com/"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = { name: "", dob: "", pic: "" };
    let currentRoom = "Saudi Arabia";
    let lastSentMessage = "";

    const countries = ["India", "USA", "UK", "Canada", "Brazil", "Japan", "Germany", "France", "Russia", "Australia", "Italy", "Spain", "Mexico", "China", "South Korea", "South Africa", "Nigeria", "Argentina", "Indonesia", "Saudi Arabia", "Turkey", "Egypt", "Pakistan", "Nepal", "Bangladesh"];

    const countryListEl = document.getElementById('countryList');
    countries.forEach((country) => {
        const btn = document.createElement('button');
        btn.className = `country-btn ${country === currentRoom ? 'active' : ''}`;
        btn.innerHTML = `🌐 ${country}`;
        btn.onclick = () => switchRoom(country, btn);
        countryListEl.appendChild(btn);
    });

    function saveUser() {
        const name = document.getElementById('nameInput').value.trim();
        const dob = document.getElementById('dobInput').value;
        const picFile = document.getElementById('picInput').files[0];

        if (!name || !dob) {
            alert("Name aur DOB bharna zaroori hai!");
            return;
        }

        currentUser.name = name;
        currentUser.dob = dob;

        if (picFile) {
            const reader = new FileReader();
            reader.onload = function(e) {
                currentUser.pic = e.target.result;
                finishLogin();
            }
            reader.readAsDataURL(picFile);
        } else {
            currentUser.pic = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
            finishLogin();
        }
    }

    function finishLogin() {
        document.getElementById('loginModal').style.display = "none";
        document.getElementById('userHeaderName').innerText = currentUser.name;
        document.getElementById('userHeaderPic').src = currentUser.pic;
        listenToRoom(currentRoom);
    }

    function logout() { location.reload(); }

    function switchRoom(room, btn) {
        currentRoom = room;
        document.querySelectorAll('.country-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('currentRoomTitle').innerText = `🌐 ${room} Chatroom`;
        listenToRoom(room);
    }

    function listenToRoom(room) {
        const chatBox = document.getElementById('chatMessages');
        chatBox.innerHTML = "";
        db.ref('rooms/' + room).limitToLast(30).off();
        db.ref('rooms/' + room).limitToLast(30).on('child_added', (snapshot) => {
            appendMessage(snapshot.val());
        });
    }

    function sendMessage() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();

        if (!text) return;
        if (text === lastSentMessage) {
            alert("⚠️ Same message dobara nahi bhej sakte!");
            return;
        }

        const msgData = {
            sender: currentUser.name,
            dob: currentUser.dob,
            pic: currentUser.pic,
            text: text,
            timestamp: Date.now()
        };

        db.ref('rooms/' + currentRoom).push(msgData);
        lastSentMessage = text;
        input.value = "";
    }

    function appendMessage(data) {
        const chatBox = document.getElementById('chatMessages');
        const msgDiv = document.createElement('div');
        msgDiv.className = "msg-card";
        
        const safeName = (data.sender || 'User').replace(/'/g, "\\'");
        const safePic = data.pic || "https://cdn-icons-png.flaticon.com/512/149/149071.png";
        const safeDob = data.dob || "";

        msgDiv.innerHTML = `
            <img src="${safePic}" class="msg-avatar" onclick="showUserProfile('${safeName}', '${safeDob}', '${safePic}')">
            <div>
                <div class="msg-info">
                    <span class="msg-author" onclick="showUserProfile('${safeName}', '${safeDob}', '${safePic}')">${data.sender}</span>
                </div>
                <div class="msg-text">${data.text}</div>
            </div>
        `;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showUserProfile(name, dob, pic) {
        document.getElementById('viewUserName').innerText = name;
        document.getElementById('viewUserDob').innerText = `DOB: ${dob || 'Not Provided'}`;
        document.getElementById('viewUserPic').src = pic;
        document.getElementById('profileModal').style.display = 'flex';
    }

    function openMyProfile() {
        if(currentUser.name) {
            showUserProfile(currentUser.name, currentUser.dob, currentUser.pic);
        }
    }

    function closeProfileModal() {
        document.getElementById('profileModal').style.display = 'none';
    }

    document.getElementById('msgInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
